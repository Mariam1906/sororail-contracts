# cargo-deny policy for the SoroRail workspace.
#
# `cargo audit` in ci.yml is the vulnerability gate: any advisory fails it,
# whatever the severity (see SECURITY.md). This file covers the checks that
# audit does not perform: the SPDX allow-list, duplicate versions, dependency
# sources, and — for a full `cargo deny check` — yanked crate versions.
#
# Run locally with: cargo deny check

[advisories]
version = 2
# A yanked version in Cargo.lock is a deliberate decision, not an accident.
yanked = "deny"
# Unmaintained notices are risk signals, not vulnerabilities; `cargo audit`
# already reports them. Limit hard failures to crates we chose directly.
unmaintained = "workspace"
ignore = []

[bans]
# Duplicate versions are reported but do not fail a build: soroban-sdk's tree
# legitimately carries more than one version of a few small crates.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[licenses]
version = 2
confidence-threshold = 0.8
# Only permissive licences are allowed. Anything copyleft — GPL, LGPL as the
# sole licence, AGPL, SSPL — is intentionally absent, so adding such a
# dependency fails `cargo deny check licenses`.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
