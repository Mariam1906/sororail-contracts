# Dependabot keeps Cargo and Actions deps monitored (issue #54).
# SPEC.md forbids pinning soroban-sdk prereleases; ignore pre-release
# version ranges so we only get nudged when a stable release lands.

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: chore
      include: scope
    # Group all soroban-* crate bumps into a single PR (issue #454).
    #
    # Why: soroban-sdk, soroban-env-host, and other soroban-* crates are
    # released together and must be updated atomically. Individual per-crate
    # PRs fail CI until every crate in the set is on the same version because
    # the workspace Cargo.lock records a single resolved version for each.
    # Grouping them ensures the dependency set moves as a unit.
    groups:
      soroban:
        patterns:
          - "soroban-*"
    # Ignore every pre-release of soroban-sdk for the next major lines so a
    # floating *-rc* on crates.io cannot open a PR. Stable 28.0.0 / 29.0.0
    # still open normally once they exist without a pre-release identifier.
    ignore:
      - dependency-name: "soroban-sdk"
        versions:
          - ">=28.0.0-0, <28.0.0"
          - ">=29.0.0-0, <29.0.0"
          - ">=30.0.0-0, <30.0.0"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: chore
      include: scope
