# git-cliff configuration (#444). Generates CHANGELOG.md from Conventional
# Commits already landed on main. Run with `make changelog` (writes the file)
# or the release workflow (which checks it in step). Keep this file alongside
# the project root so `git-cliff` is a zero-argument invocation.

[changelog]
# Preamble kept in sync with the hand-edited header the project has today,
# so a switch to the generator does not churn the top of the file.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
\n
"""
# Render per-release blocks. Unreleased commits are emitted under
# `[Unreleased]` so the changelog never claims a version it has not cut.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}{% if commit.scope %} (**{{ commit.scope }}**){% endif %}\
{% if commit.breaking %} **BREAKING**{% endif %}\
{% if commit.github.pr_number %} (#{{ commit.github.pr_number }}){% endif %}\
\n\
{% endfor %}\
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Map Conventional types to the "Keep a Changelog" headings the file already
# uses. Anything that does not match falls through to a hidden group so the
# changelog does not fill up with chores and CI noise.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^add", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^change", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Changed" },
  { message = "^deprecate", group = "Deprecated" },
  { message = "^remove", group = "Removed" },
  { message = "^security", group = "Security" },
  { message = "^docs", group = "Documentation" },
  # Noise: hidden from the public changelog.
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+.[0-9]+.[0-9]+"
# Drop merge commits — they pollute the changelog on squash-and-merge trees.
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
